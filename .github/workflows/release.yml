name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-notarize-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Import Developer ID Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm certificate.p12

      - name: Build (no signing)
        run: |
          xcodebuild archive \
            -scheme BdpanFinder \
            -configuration Release \
            -archivePath build/BdpanFinder.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=97XBW2A43H

      - name: Verify certificate
        run: |
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning build.keychain || true

      - name: Sign with Developer ID
        run: |
          APP="build/BdpanFinder.xcarchive/Products/Applications/BdpanFinder.app"
          APPEX="$APP/Contents/PlugIns/BdpanFinderExt.appex"
          IDENTITY="Developer ID Application: Jian Shuo Wang (97XBW2A43H)"

          # Sign inner → outer
          codesign --force --sign "$IDENTITY" \
            --entitlements BdpanFinderExt/BdpanFinderExt-Release.entitlements \
            --options runtime \
            "$APPEX"

          codesign --force --sign "$IDENTITY" \
            --entitlements BdpanFinder/BdpanFinder.entitlements \
            --options runtime \
            "$APP"

          cp -r "$APP" build/BdpanFinder.app

      - name: Notarize
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_CONTENT" > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          ditto -c -k --keepParent build/BdpanFinder.app build/BdpanFinder-notarize.zip
          xcrun notarytool submit build/BdpanFinder-notarize.zip \
            --key ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

      - name: Staple
        run: xcrun stapler staple build/BdpanFinder.app

      - name: Package and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ditto -c -k --keepParent build/BdpanFinder.app \
            "build/BdpanFinder-${TAG}.zip"
          gh release create "$TAG" \
            "build/BdpanFinder-${TAG}.zip" \
            --title "$TAG" \
            --generate-notes
